<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">Still — Focus on purpose</title>
  <desc id="description">A calm green promotional tile for the Still Chrome extension.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b322d"/>
      <stop offset="1" stop-color="#294b40"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10221e" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="440" height="280" rx="22" fill="url(#background)"/>
  <circle cx="420" cy="18" r="104" fill="none" stroke="#7fa592" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="420" cy="18" r="74" fill="none" stroke="#7fa592" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="23" cy="278" r="90" fill="none" stroke="#7fa592" stroke-opacity="0.1" stroke-width="2"/>


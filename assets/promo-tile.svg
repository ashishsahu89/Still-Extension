  <text x="132" y="82" fill="#f4efe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="650" letter-spacing="-1.1">Still</text>
  <text x="134" y="112" fill="#c5d7cd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500">Focus on purpose</text>


    <circle cx="25" cy="26" r="9" fill="#91b8d3"/>
    <text x="45" y="32" fill="#f4efe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Organise</text>

    <circle cx="76" cy="82" r="27" fill="none" stroke="#496a51" stroke-width="4"/>
    <path d="M76 95V75" fill="none" stroke="#496a51" stroke-width="4" stroke-linecap="round"/>
    <path d="M75 78C65 78 59 71 59 62c10 0 16 5 17 13" fill="#496a51"/>
    <path d="M77 78c10 0 16-7 16-16-10 0-16 5-17 13" fill="#496a51"/>
